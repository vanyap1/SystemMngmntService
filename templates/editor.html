<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Editor — {{ app_title }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; background: #1e1e1e; color: #cccccc;
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; }

        /* ── Layout ── */
        #app { display: flex; flex-direction: column; height: 100vh; }

        /* ── Top bar ── */
        #topbar { height: 44px; background: #1c1c1c; border-bottom: 1px solid #2a2a2a;
            display: flex; align-items: center; padding: 0 12px; gap: 6px; flex-shrink: 0; }
        #topbar .brand { font-weight: 600; font-size: 13px; color: #ccc; margin-right: auto; }

        /* ── Workspace ── */
        #workspace { display: flex; flex: 1; min-height: 0; }

        /* ── Sidebar ── */
        #sidebar { width: 300px; background: #141414; border-right: 1px solid #2a2a2a;
            display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; }
        #sidebar-title { padding: 9px 12px; font-size: 11px; font-weight: 700;
            letter-spacing: 1.2px; color: #bbb; text-transform: uppercase;
            border-bottom: 1px solid #2a2a2a; flex-shrink: 0;
            display: flex; align-items: center; }
        #file-tree { overflow-y: auto; flex: 1; min-height: 0; padding: 4px 0; }
        #file-tree::-webkit-scrollbar { width: 6px; }
        #file-tree::-webkit-scrollbar-track { background: #252526; }
        #file-tree::-webkit-scrollbar-thumb { background: #424242; border-radius: 3px; }

        .tree-node { user-select: none; }
        .tree-row { display: flex; align-items: center; padding: 3px 8px; cursor: pointer;
            white-space: nowrap; overflow: hidden; color: #ccc; gap: 5px; }
        .tree-row:hover { background: #2a2d2e; }
        .tree-row.selected { background: #094771; color: #fff; }
        .tree-row .arrow { width: 12px; font-size: 9px; flex-shrink: 0; color: #888; }
        .tree-row .ico { width: 16px; text-align: center; flex-shrink: 0; font-size: 13px; }
        .tree-row .lbl { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
        .tree-children { display: none; }
        .tree-children.open { display: block; }

        /* ── Right column ── */
        #right-col { flex: 1; display: flex; flex-direction: row; min-width: 0; min-height: 0; }
        #center-col { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }

        /* ── Editor panel ── */
        #editor-panel { flex: 1; display: flex; flex-direction: column; min-height: 0; background: #1e1e1e; }
        #tab-bar { height: 35px; background: #252526; display: flex; align-items: stretch;
            border-bottom: 1px solid #1e1e1e; flex-shrink: 0; overflow: hidden; }
        #tab-scroll { display: flex; align-items: stretch; flex: 1;
            overflow-x: auto; overflow-y: hidden; }
        #tab-scroll::-webkit-scrollbar { height: 3px; }
        #tab-scroll::-webkit-scrollbar-thumb { background: #555; border-radius: 2px; }
        .tab { display: flex; align-items: center; gap: 5px; padding: 0 8px 0 12px;
            min-width: 90px; max-width: 180px; cursor: pointer; user-select: none;
            border-right: 1px solid #1e1e1e; border-top: 2px solid transparent;
            font-size: 12px; color: #999; background: #2d2d2d; flex-shrink: 0; overflow: hidden; }
        .tab:hover { background: #2a2d2e; color: #ccc; }
        .tab.active { background: #1e1e1e; color: #ccc; border-top-color: #007acc; }
        .tab .tab-ico { font-size: 12px; flex-shrink: 0; }
        .tab .tab-name { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0;
            white-space: nowrap; }
        .tab .tab-dirty { color: #e8a838; font-size: 11px; flex-shrink: 0; }
        .tab .tab-close { flex-shrink: 0; width: 18px; height: 18px; display: flex;
            align-items: center; justify-content: center; border-radius: 3px;
            font-size: 14px; color: transparent; line-height: 1; }
        .tab:hover .tab-close, .tab.active .tab-close { color: #888; }
        .tab .tab-close:hover { background: rgba(255,255,255,.1); color: #fff !important; }
        .tab-actions { display: flex; align-items: center; gap: 4px; padding: 0 8px;
            flex-shrink: 0; border-left: 1px solid #333; }
        #save-ok { font-size: 11px; color: #4ec9b0; display: none; padding: 0 4px; }
        #monaco-container { flex: 1; min-height: 0; }

        /* ── Status bar ── */
        #statusbar { height: 26px; background: #007acc; display: flex; align-items: center;
            padding: 0 12px; font-size: 11.5px; color: #fff; flex-shrink: 0; gap: 10px; }
        #svc-dot { width: 8px; height: 8px; border-radius: 50%; background: #aaa; flex-shrink: 0; }
        #svc-dot.running { background: #4ec9b0; box-shadow: 0 0 4px #4ec9b0; }
        #svc-dot.stopped { background: #f44747; }
        #status-detail { opacity: .85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }

        /* ── Buttons ── */
        .btn { padding: 4px 11px; font-size: 12px; border-radius: 4px; border: 1px solid transparent;
            cursor: pointer; line-height: 1.5; white-space: nowrap; text-decoration: none;
            display: inline-flex; align-items: center; gap: 4px; }
        .btn:hover { filter: brightness(1.2); text-decoration: none; }
        .btn-start   { background: #1b4d2e; border-color: #2e7d46; color: #6dbf85; }
        .btn-stop    { background: #4d1b1b; border-color: #7d2e2e; color: #e08080; }
        .btn-restart { background: #4d3b1a; border-color: #7d5e2e; color: #d4a95a; }
        .btn-back    { background: transparent; border-color: #3a3a3a; color: #777; }
        .btn-back:hover { color: #ccc; border-color: #555; filter: none; }
        .btn-save    { background: #0d3a6e; border-color: #1a5fa0; color: #7ec8f5; }
        .btn-logout  { background: transparent; border-color: #3a3a3a; color: #555; }
        .btn-logout:hover { color: #e08080; border-color: #7d2e2e; filter: none; }
        .btn-sm { padding: 3px 8px; font-size: 12px; }

        /* ── Toast ── */
        .toast { position: fixed; bottom: 36px; right: 14px; padding: 8px 14px; border-radius: 5px;
            font-size: 12px; z-index: 9999; pointer-events: none; transition: opacity .3s; }
        .toast.ok    { background: #1e3a1e; color: #4ec9b0; border: 1px solid #4ec9b0; }
        .toast.error { background: #5a1d1d; color: #f88;    border: 1px solid #f44; }

        /* ── Sidebar sysinfo ── */
        #sysinfo-panel { background: #1a1a1a; flex-shrink: 0; min-height: 500px;
            display: flex; flex-direction: column; overflow: hidden; }
        #sysinfo-title { padding: 8px 10px 8px 12px; font-size: 11px; font-weight: 700;
            letter-spacing: 1.2px; color: #bbb; text-transform: uppercase;
            border-bottom: 1px solid #111; flex-shrink: 0;
            display: flex; align-items: center; }
        #sysinfo-title span { flex: 1; }
        #sysinfo-ts { font-size: 10px; color: #444; font-weight: normal;
            letter-spacing: 0; text-transform: none; }
        #sysinfo-body { overflow-y: auto; flex: 1; padding: 5px 10px 8px; font-size: 11.5px; }
        #sysinfo-body::-webkit-scrollbar { width: 5px; }
        #sysinfo-body::-webkit-scrollbar-track { background: #1a1a1a; }
        #sysinfo-body::-webkit-scrollbar-thumb { background: #424242; border-radius: 3px; }
        .si-section { font-size: 10px; color: #555; text-transform: uppercase;
            letter-spacing: .8px; margin: 7px 0 3px; user-select: none; }
        .si-row { display: flex; justify-content: space-between; align-items: baseline;
            margin: 1px 0; gap: 4px; }
        .si-key { color: #777; white-space: nowrap; flex-shrink: 0; }
        .si-val { color: #ccc; text-align: right; overflow: hidden;
            text-overflow: ellipsis; font-size: 11px; white-space: nowrap; }
        .si-bar { height: 3px; border-radius: 2px; background: #2a2a2a; margin: 2px 0 3px; }
        .si-fill { height: 100%; border-radius: 2px; transition: width .8s; }
        .si-fill.ok   { background: #4ec9b0; }
        .si-fill.warn { background: #e8a838; }
        .si-fill.crit { background: #f44747; }
        .si-lsblk { display: none; }
        .si-tbl { width: 100%; border-collapse: collapse; font-size: 11px; }
        .si-tbl th { color: #444; font-weight: 600; font-size: 9.5px; text-transform: uppercase;
            letter-spacing: .7px; padding: 1px 5px 3px; border-bottom: 1px solid #2a2a2a;
            white-space: nowrap; }
        .si-tbl td { padding: 2px 5px; vertical-align: top; border-bottom: 1px solid #1f1f1f; }
        .si-tbl tr:last-child td { border-bottom: none; }
        .si-tbl tr:hover td { background: rgba(255,255,255,.03); }
        .td-name { color: #9cdcfe; white-space: nowrap;
            font-family: 'Cascadia Code','Fira Mono',Consolas,monospace; font-size: 10.5px; }
        .td-name.child { padding-left: 14px; color: #7ab8d4; }
        .td-size { color: #4ec9b0; white-space: nowrap; text-align: right; font-size: 10.5px; }
        .td-type { color: #555; white-space: nowrap; font-size: 10px; }
        .td-ro-badge { font-size: 8px; color: #f44747; background: #2d1a1a;
            border: 1px solid #5a2222; border-radius: 2px; padding: 0 2px; margin-left: 2px; }
        .td-mount { color: #ce9178; font-size: 10px; line-height: 1.5; word-break: break-all; }
        .si-up   { color: #4ec9b0; }
        .si-down { color: #555; }

        /* ── Outline panel ── */
        #outline-panel { width: 300px; background: #141414; border-left: 1px solid #2a2a2a;
            display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; }
        #outline-panel.hidden { display: none; }
        #outline-title { padding: 9px 10px 9px 12px; font-size: 11px; font-weight: 700;
            letter-spacing: 1.2px; color: #bbb; text-transform: uppercase;
            border-bottom: 1px solid #2a2a2a; flex-shrink: 0;
            display: flex; align-items: center; gap: 4px; }
        #outline-title span { flex: 1; }
        #outline-toggle { font-size: 14px; color: #555; cursor: pointer;
            padding: 0 2px; line-height: 1; user-select: none; }
        #outline-toggle:hover { color: #ccc; }
        #outline-list { overflow-y: auto; flex: 1; padding: 4px 0; }
        #outline-list::-webkit-scrollbar { width: 5px; }
        #outline-list::-webkit-scrollbar-track { background: #252526; }
        #outline-list::-webkit-scrollbar-thumb { background: #424242; border-radius: 3px; }
        .sym-group { padding: 6px 10px 2px; font-size: 10px; color: #666;
            text-transform: uppercase; letter-spacing: .8px; user-select: none; }
        .sym-item { display: flex; align-items: center; gap: 6px;
            padding: 3px 12px; cursor: pointer; white-space: nowrap; overflow: hidden;
            color: #c8c8c8; font-size: 12px; }
        .sym-item:hover { background: #2a2d2e; }
        .sym-item.active { background: #094771; color: #fff; }
        .sym-item .sym-ico { flex-shrink: 0; font-size: 12px; }
        .sym-item .sym-name { overflow: hidden; text-overflow: ellipsis; flex: 1; }
        .sym-item .sym-line { font-size: 10px; color: #555; flex-shrink: 0; }
        .sym-item:hover .sym-line { color: #888; }
        #outline-empty { padding: 12px; color: #555; font-size: 12px; }

        /* ── Resize grip ── */
        #resize-grip { height: 5px; background: #111; cursor: ns-resize; flex-shrink: 0;
            border-top: 2px solid #2a2a2a; transition: border-color .15s; }
        #resize-grip:hover, #resize-grip.dragging { border-top-color: #007acc; }

        /* ── Console panel ── */
        #console-panel { height: 220px; background: #1a1a1a; display: flex;
            flex-direction: column; flex-shrink: 0; }
        #console-tabs { height: 30px; background: #1a1a1a; display: flex;
            align-items: stretch; border-bottom: 1px solid #2a2a2a; flex-shrink: 0; }
        .ctab { padding: 0 14px; display: flex; align-items: center; cursor: pointer;
            font-size: 12px; color: #888; border-right: 1px solid #222; user-select: none;
            border-top: 2px solid transparent; }
        .ctab:hover { color: #ccc; }
        .ctab.active { color: #fff; background: #111; border-top-color: #007acc; }
        .c-spacer { flex: 1; }
        .c-action { padding: 0 9px; font-size: 13px; color: #555; cursor: pointer;
            display: flex; align-items: center; }
        .c-action:hover { color: #ccc; }
        #console-body { flex: 1; overflow: hidden; position: relative; min-height: 0; }
        .cpane { position: absolute; inset: 0; overflow-y: auto; padding: 6px 10px;
            font-family: 'Cascadia Code','Fira Mono',Consolas,monospace; font-size: 12px;
            line-height: 1.55; display: none; white-space: pre-wrap; word-break: break-all; }
        .cpane.active { display: block; }
        .cpane::-webkit-scrollbar { width: 6px; }
        .cpane::-webkit-scrollbar-track { background: #1a1a1a; }
        .cpane::-webkit-scrollbar-thumb { background: #424242; border-radius: 3px; }
        /* log colors */
        .lg-run  { color: #4ec9b0; font-weight: bold; }
        .lg-stop { color: #f44747; font-weight: bold; }
        .lg-warn { color: #e8a838; font-weight: bold; }
        .lg-key  { color: #9cdcfe; }
        .lg-val  { color: #ce9178; }
        .lg-arun { color: #4ec9b0; }
        .lg-fail { color: #f44747; }
        .lg-ts   { color: #608b4e; }
        .lg-host { color: #dcdcaa; }
        .lg-dim  { color: #666; }
        /* terminal */
        #term-pane { padding: 0 !important; overflow: hidden !important;
            white-space: normal !important; }
        #term-pane.active { display: flex !important; flex-direction: column; }
        #xterm-container { flex: 1; min-height: 0; overflow: hidden; }
        #xterm-container .xterm { height: 100%; }
        #term-input-row { display: flex; align-items: center; flex-shrink: 0;
            background: #1a1a1a; padding: 3px 8px 4px; gap: 6px;
            border-top: 1px solid #2a2a2a; }
        #term-prompt { color: #4ec9b0; font-family: 'Cascadia Code','Fira Mono',Consolas,monospace;
            font-size: 12px; flex-shrink: 0; white-space: nowrap; }
        #term-input { flex: 1; background: transparent; border: none; outline: none;
            color: #9cdcfe; font-family: 'Cascadia Code','Fira Mono',Consolas,monospace;
            font-size: 12px; caret-color: #fff; }

        /* ── Service selector ── */
        .svc-select { background: #1a1a1a; border: 1px solid #3a3a3a; color: #9cdcfe;
            font-size: 12px; border-radius: 4px; padding: 3px 6px; cursor: pointer; outline: none;
            font-family: 'Cascadia Code','Fira Mono',Consolas,monospace; max-width: 210px; height: 28px; }
        .svc-select:focus { border-color: #555; }

        /* ── Services modal ── */
        .svc-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.75);
            z-index: 3000; display: none; align-items: center; justify-content: center; }
        .svc-overlay.open { display: flex; }
        .svc-modal-box { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px;
            width: 760px; max-width: 95vw; max-height: 80vh; display: flex; flex-direction: column;
            box-shadow: 0 20px 60px rgba(0,0,0,.9); }
        .svc-mhead { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
            border-bottom: 1px solid #2a2a2a; flex-shrink: 0; }
        .svc-mtitle { font-size: 13px; font-weight: 600; color: #ccc; flex: 1; }
        .svc-mfilter { background: #111; border: 1px solid #333; color: #ddd; border-radius: 5px;
            padding: 5px 10px; font-size: 12px; outline: none; width: 200px; }
        .svc-mfilter:focus { border-color: #555; }
        .svc-mclose { background: none; border: none; color: #555; font-size: 20px;
            cursor: pointer; padding: 0 4px; line-height: 1; }
        .svc-mclose:hover { color: #ccc; }
        .svc-mbody { overflow-y: auto; flex: 1; min-height: 0; }
        .svc-mbody::-webkit-scrollbar { width: 5px; }
        .svc-mbody::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        .svc-mtbl { width: 100%; border-collapse: collapse; font-size: 12px; }
        .svc-mtbl th { font-size: 10px; font-weight: 700; text-transform: uppercase;
            letter-spacing: .7px; color: #444; padding: 6px 12px; border-bottom: 1px solid #242424;
            white-space: nowrap; position: sticky; top: 0; background: #1a1a1a; z-index: 1; }
        .svc-mtbl td { padding: 5px 12px; border-bottom: 1px solid #1e1e1e; vertical-align: middle; }
        .svc-mtbl tr:last-child td { border-bottom: none; }
        .svc-mtbl tr:hover td { background: rgba(255,255,255,.03); }
        .svc-mtbl tr.svc-cur td { background: rgba(0,122,204,.08); }
        .svc-mtbl tr.svc-cur:hover td { background: rgba(0,122,204,.14); }
        .svc-mname { color: #9cdcfe; font-family: 'Cascadia Code','Fira Mono',Consolas,monospace;
            font-size: 11px; cursor: pointer; white-space: nowrap; }
        .svc-mname:hover { color: #fff; text-decoration: underline; }
        .svc-mdesc { color: #555; font-size: 11px; max-width: 240px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
        .sub-badge { display: inline-block; padding: 1px 6px; border-radius: 3px;
            font-size: 10px; font-weight: 600; white-space: nowrap; }
        .sub-running { background: #0d2a18; color: #4ec9b0; border: 1px solid #1f5e32; }
        .sub-failed  { background: #2d1010; color: #f44747; border: 1px solid #5a2222; }
        .sub-dead    { background: #1a1a1a; color: #555;    border: 1px solid #2a2a2a; }
        .sub-other   { background: #1c2230; color: #7ec8f5; border: 1px solid #2a3a55; }
        .svc-macts { display: flex; gap: 4px; }
        .svc-mact { padding: 2px 7px; font-size: 11px; border-radius: 3px;
            border: 1px solid transparent; cursor: pointer; line-height: 1.5; }
        .svc-mact:hover { filter: brightness(1.2); }
        .sma-s { background: #1b4d2e; border-color: #2e7d46; color: #6dbf85; }
        .sma-x { background: #4d1b1b; border-color: #7d2e2e; color: #e08080; }
        .sma-r { background: #4d3b1a; border-color: #7d5e2e; color: #d4a95a; }

        /* ── Explorer extras ── */
        .tree-newfile { background: none; border: none; color: #555; font-size: 17px;
            cursor: pointer; padding: 0 2px; margin-left: auto; line-height: 1; }
        .tree-newfile:hover { color: #4ec9b0; }
        .tree-row .fsize { font-size: 10px; color: #444; flex-shrink: 0; padding-left: 3px; }
        .tree-row:hover .fsize { display: none; }
        .tree-row .faction { display: none; gap: 1px; flex-shrink: 0; }
        .tree-row:hover .faction { display: flex; }
        .faction-btn { background: none; border: none; color: #666; font-size: 12px;
            cursor: pointer; padding: 1px 4px; border-radius: 3px; line-height: 1.4; }
        .faction-btn:hover { background: rgba(255,255,255,.08); color: #ccc; }
        .faction-del:hover { color: #f44747 !important; }

        /* ── Image preview ── */
        #img-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.88);
            z-index: 3500; display: none; align-items: center; justify-content: center;
            flex-direction: column; gap: 12px; }
        #img-overlay.open { display: flex; }
        #img-preview { max-width: 90vw; max-height: 85vh; object-fit: contain;
            border-radius: 4px; box-shadow: 0 4px 40px rgba(0,0,0,.8); }
        #img-toolbar { display: flex; align-items: center; gap: 12px; }
        #img-name-lbl { font-size: 12px; color: #777; }
        .img-close-btn { background: #2a2a2a; border: 1px solid #3a3a3a; color: #ccc;
            padding: 4px 14px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .img-close-btn:hover { background: #333; }
    </style>
</head>
<body>
<div id="app">

    <!-- ── Top bar ── -->
    <div id="topbar">
        <span class="brand">⚙ {{ app_title }} — Code Editor</span>
        <select id="svc-select" class="svc-select" onchange="onSvcChange()">
            <option value="{{ service_name }}">{{ service_name }}</option>
        </select>
        <button class="btn btn-start"   onclick="svcAction('start')"  >▶</button>
        <button class="btn btn-stop"    onclick="svcAction('stop')"   >■</button>
        <button class="btn btn-restart" onclick="svcAction('restart')">↺</button>
        <button class="btn btn-back"    onclick="openSvcModal()">≡ Services</button>
        <button class="btn btn-back"    onclick="location.href='/'">← Main</button>
        <a href="/settings" class="btn btn-back">⚙ Settings</a>
        <a href="/logout" class="btn btn-logout">&#128275; Logout</a>
    </div>

    <!-- ── Workspace ── -->
    <div id="workspace">

        <!-- Sidebar -->
        <div id="sidebar">
            <div id="sidebar-title">
                Explorer
                <button class="tree-newfile" onclick="newFile()" title="New File">+</button>
            </div>
            <div id="file-tree">
                <div style="padding:12px;color:#888;font-size:12px">Loading…</div>
            </div>
            <!-- Sidebar resize grip -->
            <!-- Sidebar -->
            <div id="sysinfo-panel">
                <div id="sysinfo-title">
                    <span>System</span>
                    <span id="sysinfo-ts"></span>
                </div>
                <div id="sysinfo-body">Loading…</div>
            </div>
        </div>

        <!-- Right column: editor + console + outline -->
        <div id="right-col">

            <!-- Center: editor + console -->
            <div id="center-col">

                <!-- Editor panel -->
                <div id="editor-panel">
                    <div id="tab-bar">
                        <div id="tab-scroll"><!-- tabs inserted by JS --></div>
                        <div class="tab-actions">
                            <span id="save-ok">✓ Saved</span>
                            <button class="btn btn-save btn-sm" onclick="saveFile()" title="Save (Ctrl+S)">&#128190;</button>
                            
                        <!--
                            <button class="btn btn-start btn-sm" onclick="svcAction('start')" title="Start service">&#9654;</button>
                            <button class="btn btn-stop btn-sm" onclick="svcAction('stop')" title="Stop service">&#9632;</button>
                        -->
                        </div>
                    </div>
                    <div id="monaco-container"></div>
                </div>

                <!-- Resize grip -->
                <div id="resize-grip"></div>

                <!-- Console panel -->
                <div id="console-panel">
                    <div id="console-tabs">
                        <div class="ctab active" data-tab="log" onclick="switchTab('log')">Service Log</div>
                        <div class="ctab" data-tab="term" onclick="switchTab('term')">Terminal</div>
                        <div class="c-spacer"></div>
                        <span class="c-action" onclick="clearConsole()" title="Clear">✕</span>
                        <span class="c-action" onclick="refreshLog()" title="Refresh">↺</span>
                    </div>
                    <div id="console-body">
                        <div id="log-pane" class="cpane active"></div>
                        <div id="term-pane" class="cpane">
                            <div id="xterm-container"></div>
                            <div id="term-input-row">
                                <span id="term-prompt">pi@rpi:~$ </span>
                                <input id="term-input" type="text" autocomplete="off"
                                       spellcheck="false" placeholder="enter command…"
                                       onkeydown="termKeyDown(event)">
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Outline panel -->
            <div id="outline-panel">
                <div id="outline-title">
                    <span>Outline</span>
                    <span id="outline-toggle" onclick="toggleOutline()" title="Hide outline">×</span>
                </div>
                <div id="outline-list">
                    <div id="outline-empty">Open a file to see symbols</div>
                </div>
            </div>

        </div>

    </div>

    <!-- ── Status bar ── -->
    <div id="statusbar">
        <div id="svc-dot"></div>
        <span style="font-weight:600;flex-shrink:0">{{ service_name }}</span>
        <span id="status-detail">Loading…</span>
    </div>

</div>

<script>
    let editor = null;
    let currentPath = null;
    let activeRow = null;
    // ── Tab state ────────────────────────────────────────────────
    const tabs = new Map();   // path → { path, name, model, viewState, row, dirty }
    let activeTabPath = null;

    // ── Monaco init ─────────────────────────────────────────────────────────────
    const VS = 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs';
    const s = document.createElement('script');
    s.src = VS + '/loader.min.js';
    s.onload = () => {
        require.config({ paths: { vs: VS } });
        require(['vs/editor/editor.main'], () => {
            editor = monaco.editor.create(document.getElementById('monaco-container'), {
                value: '// Select a file from the sidebar to open it',
                language: 'python',
                theme: 'vs-dark',
                automaticLayout: true,
                fontSize: 14,
                tabSize: 4,
                minimap: { enabled: true },
                scrollBeyondLastLine: false,
                renderLineHighlight: 'all',
                smoothScrolling: true,
                cursorBlinking: 'smooth',
            });
            editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, saveFile);
            editor.onDidChangeModelContent(() => { scheduleOutline(); });
            editor.onDidChangeCursorPosition(syncOutlineCursor);
        });
    };
    document.head.appendChild(s);

    // ── Language / icon helpers ─────────────────────────────────────────────────
    const LANG_MAP = {
        py:'python', js:'javascript', ts:'typescript', tsx:'typescript', jsx:'javascript',
        html:'html', css:'css', scss:'css', json:'json', md:'markdown',
        sh:'shell', bash:'shell', yaml:'yaml', yml:'yaml',
        xml:'xml', ini:'ini', cfg:'ini', conf:'ini', txt:'plaintext', log:'plaintext'
    };
    const ICON_MAP = { py:'🐍', js:'📜', ts:'📜', html:'🌐', css:'🎨', json:'{}',
                       md:'📝', sh:'⚙', yaml:'⚙', yml:'⚙' };

    function detectLang(name) {
        return LANG_MAP[name.split('.').pop().toLowerCase()] || 'plaintext';
    }
    function fileIcon(name) {
        return ICON_MAP[name.split('.').pop().toLowerCase()] || '📄';
    }
    function esc(s) {
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function fmtSize(b) {
        if (b >= 1048576) return (b/1048576).toFixed(1)+' MB';
        if (b >= 1024)    return (b/1024).toFixed(0)+' KB';
        return b+' B';
    }
    const IMG_EXTS = new Set(['png','jpg','jpeg','gif','webp','svg','bmp','ico','avif']);
    function isImage(name) { return IMG_EXTS.has(name.split('.').pop().toLowerCase()); }

    // ── File tree ───────────────────────────────────────────────────────────────
    function buildTree(items, depth) {
        const ul = document.createElement('ul');
        ul.style.cssText = 'list-style:none;padding:0;margin:0';
        for (const item of items) {
            const li = document.createElement('li');
            li.className = 'tree-node';
            const row = document.createElement('div');
            row.className = 'tree-row';
            row.style.paddingLeft = (8 + depth * 16) + 'px';

            if (item.type === 'dir') {
                row.innerHTML = `<span class="arrow">▶</span><span class="ico">📁</span><span class="lbl">${esc(item.name)}</span>`;
                const sub = buildTree(item.children || [], depth + 1);
                sub.className = 'tree-children';
                row.addEventListener('click', () => {
                    const open = sub.classList.toggle('open');
                    row.querySelector('.arrow').textContent = open ? '▼' : '▶';
                    row.querySelectorAll('.ico')[0].textContent = open ? '📂' : '📁';
                });
                li.appendChild(row);
                li.appendChild(sub);
            } else {
                const sizeStr = item.size != null ? fmtSize(item.size) : '';
                const ico = isImage(item.name) ? '🖼️' : fileIcon(item.name);
                row.innerHTML =
                    `<span class="arrow"></span>` +
                    `<span class="ico">${ico}</span>` +
                    `<span class="lbl">${esc(item.name)}</span>` +
                    `<span class="fsize">${esc(sizeStr)}</span>` +
                    `<span class="faction">` +
                      `<button class="faction-btn" title="Rename">✏️</button>` +
                      `<button class="faction-btn faction-del" title="Delete">×</button>` +
                    `</span>`;
                row.querySelector('.faction-btn:not(.faction-del)').addEventListener('click', e => {
                    e.stopPropagation();
                    renameFile(item.path, item.name);
                });
                row.querySelector('.faction-del').addEventListener('click', e => {
                    e.stopPropagation();
                    deleteFile(item.path, item.name, li);
                });
                if (isImage(item.name)) {
                    row.addEventListener('click', () => openImage(item.path, item.name, row));
                } else {
                    row.addEventListener('click', () => openFile(item.path, item.name, row));
                }
                li.appendChild(row);
            }
            ul.appendChild(li);
        }
        return ul;
    }

    function reloadTree() {
        fetch('/api/tree')
            .then(r => r.json())
            .then(tree => {
                const el = document.getElementById('file-tree');
                el.innerHTML = '';
                el.appendChild(buildTree(tree, 0));
            })
            .catch(() => {
                document.getElementById('file-tree').innerHTML =
                    '<div style="padding:12px;color:#f44">Failed to load tree</div>';
            });
    }
    reloadTree();

    function newFile() {
        const name = prompt('New file name:');
        if (!name || !name.trim()) return;
        fetch('/api/file_create', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name: name.trim()})
        }).then(r => r.json()).then(d => {
            if (d.success) { reloadTree(); toast(d.name + ' created'); }
            else toast('Error: ' + (d.error || 'unknown'), true);
        }).catch(() => toast('Request failed', true));
    }

    function renameFile(path, name) {
        const newName = prompt('Rename "' + name + '" to:', name);
        if (!newName || !newName.trim() || newName.trim() === name) return;
        fetch('/api/file_rename', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({path, new_name: newName.trim()})
        }).then(r => r.json()).then(d => {
            if (d.success) {
                if (tabs.has(path)) {
                    const tab = tabs.get(path);
                    const newPath = d.new_path;
                    const newModel = monaco.editor.createModel(tab.model.getValue(), detectLang(d.new_name));
                    newModel.onDidChangeContent(() => {
                        const t = tabs.get(newPath);
                        if (t) { t.dirty = true; renderTabs(); }
                    });
                    tab.model.dispose();
                    tab.name = d.new_name; tab.path = newPath;
                    tab.model = newModel; tab.dirty = false;
                    tabs.delete(path); tabs.set(newPath, tab);
                    if (activeTabPath === path) {
                        activeTabPath = newPath; currentPath = newPath;
                        editor.setModel(newModel);
                    }
                    renderTabs();
                }
                reloadTree();
                toast(name + ' → ' + d.new_name);
            } else toast('Error: ' + (d.error || 'unknown'), true);
        }).catch(() => toast('Request failed', true));
    }

    function deleteFile(path, name, li) {
        if (!confirm('Delete "' + name + '"?')) return;
        fetch('/api/file_delete', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({path})
        }).then(r => r.json()).then(d => {
            if (d.success) {
                if (tabs.has(path)) {
                    const tab = tabs.get(path);
                    if (tab.row) tab.row.classList.remove('selected');
                    tab.model.dispose(); tabs.delete(path);
                    if (activeTabPath === path) {
                        activeTabPath = null; currentPath = null;
                        const paths = [...tabs.keys()];
                        if (paths.length) { activateTab(paths[paths.length - 1]); }
                        else {
                            activeRow = null;
                            if (editor) editor.setModel(monaco.editor.createModel(
                                '// Select a file from the sidebar to open it', 'plaintext'));
                            updateOutline(); renderTabs();
                        }
                    } else { renderTabs(); }
                }
                li.remove();
                toast(name + ' deleted');
            } else toast('Error: ' + (d.error || 'unknown'), true);
        }).catch(() => toast('Request failed', true));
    }

    function openImage(path, name, row) {
        if (activeRow) activeRow.classList.remove('selected');
        activeRow = row; row.classList.add('selected');
        document.getElementById('img-preview').src =
            '/api/file_raw?path=' + encodeURIComponent(path);
        document.getElementById('img-name-lbl').textContent = name;
        document.getElementById('img-overlay').classList.add('open');
    }
    function closeImage() {
        document.getElementById('img-overlay').classList.remove('open');
        document.getElementById('img-preview').src = '';
    }
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') { closeImage(); closeSvcModal(); }
    });

    // ── Open file ───────────────────────────────────────────────────────────────
    function openFile(path, name, row) {
        if (tabs.has(path)) {
            if (activeRow) activeRow.classList.remove('selected');
            activeRow = row;
            row.classList.add('selected');
            tabs.get(path).row = row;
            activateTab(path);
            return;
        }
        if (activeRow) activeRow.classList.remove('selected');
        activeRow = row;
        row.classList.add('selected');

        fetch('/api/file?path=' + encodeURIComponent(path))
            .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
            .then(content => {
                if (!editor) return;
                const model = monaco.editor.createModel(content, detectLang(name));
                model.onDidChangeContent(() => {
                    const t = tabs.get(path);
                    if (t) { t.dirty = true; renderTabs(); }
                });
                tabs.set(path, { path, name, model, viewState: null, row, dirty: false });
                activateTab(path);
            })
            .catch(err => toast('Error opening file: ' + err.message, true));
    }

    function activateTab(path) {
        if (!editor || !tabs.has(path)) return;
        if (activeTabPath && tabs.has(activeTabPath))
            tabs.get(activeTabPath).viewState = editor.saveViewState();
        activeTabPath = path;
        currentPath = path;
        const tab = tabs.get(path);
        editor.setModel(tab.model);
        if (tab.viewState) editor.restoreViewState(tab.viewState);
        editor.focus();
        if (activeRow) activeRow.classList.remove('selected');
        if (tab.row) { activeRow = tab.row; tab.row.classList.add('selected'); }
        document.getElementById('save-ok').style.display = 'none';
        renderTabs();
        updateOutline();
    }

    function closeTab(path, event) {
        if (event) event.stopPropagation();
        const tab = tabs.get(path);
        if (!tab) return;
        if (tab.dirty && !confirm('"' + tab.name + '" has unsaved changes. Close anyway?')) return;
        if (tab.row) tab.row.classList.remove('selected');
        tab.model.dispose();
        tabs.delete(path);
        if (activeTabPath === path) {
            activeTabPath = null;
            currentPath = null;
            const paths = [...tabs.keys()];
            if (paths.length) {
                activateTab(paths[paths.length - 1]);
            } else {
                activeRow = null;
                if (editor) editor.setModel(
                    monaco.editor.createModel('// Select a file from the sidebar to open it', 'plaintext'));
                updateOutline();
                renderTabs();
            }
        } else {
            renderTabs();
        }
    }

    function renderTabs() {
        const scroll = document.getElementById('tab-scroll');
        scroll.innerHTML = '';
        for (const [path, tab] of tabs) {
            const el = document.createElement('div');
            el.className = 'tab' + (path === activeTabPath ? ' active' : '');
            el.title = path;
            el.innerHTML =
                '<span class="tab-ico">' + fileIcon(tab.name) + '</span>' +
                '<span class="tab-name">' + esc(tab.name) + '</span>' +
                (tab.dirty ? '<span class="tab-dirty">&#9679;</span>' : '') +
                '<span class="tab-close">&#215;</span>';
            el.querySelector('.tab-close').addEventListener('click', e => closeTab(path, e));
            el.addEventListener('click', () => activateTab(path));
            scroll.appendChild(el);
        }
        const active = scroll.querySelector('.tab.active');
        if (active) active.scrollIntoView({ inline: 'nearest', block: 'nearest' });
    }

    // ── Save ────────────────────────────────────────────────────────────────────
    function saveFile() {
        if (!currentPath || !editor) return;
        fetch('/api/file', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ path: currentPath, content: editor.getValue() })
        })
        .then(r => r.json())
        .then(d => {
            if (d.success) {
                const tab = tabs.get(currentPath);
                if (tab) { tab.dirty = false; renderTabs(); }
                const ok = document.getElementById('save-ok');
                ok.style.display = 'inline';
                setTimeout(() => ok.style.display = 'none', 2500);
            } else {
                toast('Save error: ' + (d.error || 'unknown'), true);
            }
        })
        .catch(err => toast('Save failed: ' + err.message, true));
    }

    // ── Service actions ─────────────────────────────────────────────────────────
    function svcAction(action) {
        const name = document.getElementById('svc-select').value || '{{ service_name }}';
        fetch('/api/service/' + action + '?name=' + encodeURIComponent(name))
            .then(r => r.json())
            .then(() => {
                toast(action.charAt(0).toUpperCase() + action.slice(1) + ' sent');
                setTimeout(refreshLog, 1500);
            })
            .catch(() => toast('Command failed', true));
    }

    // ── Status bar ──────────────────────────────────────────────────────────────
    function refreshStatus() {
        const name = document.getElementById('svc-select').value || '{{ service_name }}';
        fetch('/api/status?name=' + encodeURIComponent(name))
            .then(r => r.text())
            .then(text => {
                const dot = document.getElementById('svc-dot');
                dot.className = /active \(running\)/.test(text) ? 'running'
                              : /inactive|failed|dead/.test(text) ? 'stopped' : '';
                const line = text.split('\n').find(l => /Active:/.test(l)) || '';
                document.getElementById('status-detail').textContent = line.trim();
            })
            .catch(() => {
                document.getElementById('status-detail').textContent = 'Status unavailable';
            });
    }
    function onSvcChange() { refreshLog(); }
    refreshLog();
    setInterval(refreshLog, 10000);

    // ── Sysinfo ──────────────────────────────────────────────────────────────────
    function fmtKb(kb) {
        if (kb >= 1048576) return (kb / 1048576).toFixed(1) + ' GB';
        if (kb >= 1024)    return (kb / 1024).toFixed(0) + ' MB';
        return kb + ' KB';
    }
    function siBar(pct) {
        const c = pct >= 85 ? 'crit' : pct >= 65 ? 'warn' : 'ok';
        return `<div class="si-bar"><div class="si-fill ${c}" style="width:${pct}%"></div></div>`;
    }
    function renderSysinfo(d) {
        let h = '';
        // CPU / load
        const la1 = parseFloat((d.load || {})['1'] || 0);
        const laPct = Math.min(100, Math.round(la1 / (d.cpu_count || 1) * 100));
        h += `<div class="si-section">CPU &mdash; ${d.cpu_count || '?'} cores</div>`;
        h += `<div class="si-row"><span class="si-key">Load avg</span><span class="si-val">${(d.load||{})['1']} &middot; ${(d.load||{})['5']} &middot; ${(d.load||{})['15']}</span></div>`;
        h += siBar(laPct);
        // Memory
        const m = d.mem || {};
        h += `<div class="si-section">Memory</div>`;
        h += `<div class="si-row"><span class="si-key">RAM</span><span class="si-val">${fmtKb(m.used_kb)} / ${fmtKb(m.total_kb)} &nbsp;${m.pct}%</span></div>`;
        h += siBar(m.pct || 0);
        if (m.swap_total_kb > 0) {
            h += `<div class="si-row"><span class="si-key">Swap</span><span class="si-val">${fmtKb(m.swap_used_kb)} / ${fmtKb(m.swap_total_kb)} &nbsp;${m.swap_pct}%</span></div>`;
            h += siBar(m.swap_pct || 0);
        }
        // Network
        h += `<div class="si-section">Network</div>`;
        (d.net || []).forEach(n => {
            const cls = n.state === 'UP' ? 'si-up' : 'si-down';
            const addr = n.addrs[0] || '—';
            h += `<div class="si-row"><span class="si-key ${cls}">${esc(n.iface)}</span><span class="si-val">${esc(addr)}</span></div>`;
            for (let i = 1; i < n.addrs.length; i++)
                h += `<div class="si-row"><span class="si-key"></span><span class="si-val">${esc(n.addrs[i])}</span></div>`;
        });
        // Processes
        h += `<div class="si-section">Processes</div>`;
        h += `<div class="si-row"><span class="si-key">Running</span><span class="si-val">${esc(String(d.procs))}</span></div>`;
        // Storage
        h += `<div class="si-section">Storage</div>`;
        if (d.lsblk) h += lsblkTable(d.lsblk);
        document.getElementById('sysinfo-body').innerHTML = h;
        document.getElementById('sysinfo-ts').textContent =
            new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
    }
    function parseLsblk(text) {
        const rows = [], C = /[\u2514\u251c\u2500\u2502]/;
        let last = null;
        for (const line of text.trim().split('\n')) {
            if (!line.trim() || /^NAME\s/i.test(line)) continue;
            const m = line.match(/^([\s\u2514\u251c\u2500\u2502]*\S+)\s+\d+:\d+\s+\d+\s+(\S+)\s+(\d+)\s+(\S+)\s*(.*)/);
            if (m) {
                last = { name: m[1].replace(/[\s\u2514\u251c\u2500\u2502]/g,''),
                         isChild: C.test(m[1]), size: m[2],
                         ro: m[3]==='1', type: m[4],
                         mounts: m[5].trim() ? [m[5].trim()] : [] };
                rows.push(last);
            } else if (last) { const mp = line.trim(); if (mp) last.mounts.push(mp); }
        }
        return rows;
    }
    function lsblkTable(text) {
        const rows = parseLsblk(text);
        if (!rows.length) return '<span style="color:#555">No devices</span>';
        let t = '<table class="si-tbl"><thead><tr>'
              + '<th>Dev</th><th style="text-align:right">Size</th>'
              + '<th>Type</th><th>Mount</th></tr></thead><tbody>';
        for (const r of rows) {
            const nc = r.isChild ? ' child' : '';
            const pre = r.isChild ? '<span style="color:#333">&#x2514; </span>' : '';
            const mnt = r.mounts.map(m => esc(m)).join('<br>') || '<span style="color:#2a2a2a">—</span>';
            const ro  = r.ro ? '<span class="td-ro-badge">RO</span>' : '';
            t += `<tr><td class="td-name${nc}">${pre}${esc(r.name)}</td>`
               + `<td class="td-size">${esc(r.size)}</td>`
               + `<td class="td-type">${esc(r.type)}${ro}</td>`
               + `<td class="td-mount">${mnt}</td></tr>`;
        }
        return t + '</tbody></table>';
    }
    function fetchSysinfo() {
        fetch('/api/sysinfo').then(r => r.json()).then(renderSysinfo).catch(() => {});
    }
    fetchSysinfo();
    setInterval(fetchSysinfo, 3000);

    // ── Outline panel ─────────────────────────────────────────────────────────────
    let outlineVisible = true;
    let outlineDebounce = null;
    let activeSymItem = null;

    // Symbol extractors per language
    const SYMBOL_PATTERNS = [
        // Python class
        { re: /^(class)\s+(\w+)/,        kind: 'class',   ico: 'C' },
        // Python def / async def
        { re: /^(?:async\s+)?def\s+(\w+)/, kind: 'func',  ico: 'ƒ' },
        // JS/TS function declaration
        { re: /^(?:export\s+)?(?:async\s+)?function\s*(\w+)/, kind: 'func', ico: 'ƒ' },
        // JS/TS class
        { re: /^(?:export\s+)?(?:abstract\s+)?class\s+(\w+)/, kind: 'class', ico: 'C' },
        // JS/TS arrow / method assigned to const
        { re: /^(?:export\s+)?(?:const|let|var)\s+(\w+)\s*=\s*(?:async\s+)?(?:\([^)]*\)|\w+)\s*=>/, kind: 'arrow', ico: '⇒' },
        // JS/TS object method shorthand / class method
        { re: /^\s{2,}(?:async\s+)?(\w+)\s*\([^)]*\)\s*\{/, kind: 'method', ico: 'm' },
        // Python @decorator (just show route)
        { re: /^@\w+\.route\(['"]([^'"]+)['"]/, kind: 'route', ico: '🔗' },
        // @app.route or @blueprint
        { re: /^@[\w.]+\s*$/, kind: 'deco', ico: '@' },
    ];

    const KIND_COLOR = { class:'#4ec9b0', func:'#dcdcaa', arrow:'#9cdcfe',
                         method:'#c586c0', route:'#ce9178', deco:'#608b4e' };

    function extractSymbols(code, lang) {
        const lines = code.split('\n');
        const symbols = [];
        let lastClass = null;

        for (let i = 0; i < lines.length; i++) {
            const line = lines[i];
            const trimmed = line.trimStart();
            const indent = line.length - trimmed.length;

            for (const pat of SYMBOL_PATTERNS) {
                const m = trimmed.match(pat.re);
                if (!m) continue;
                // name is group 1 or 2 depending on pattern
                const name = m[2] || m[1];
                if (!name || name.length < 1) break;

                // track class nesting for Python
                if (pat.kind === 'class') lastClass = { name, indent };

                // skip single-char or dunder helpers that are noise
                if (name.length === 1 && pat.kind === 'func') break;

                symbols.push({
                    name,
                    kind: pat.kind,
                    ico: pat.ico,
                    line: i + 1,   // 1-based
                    indent,
                    color: KIND_COLOR[pat.kind] || '#ccc',
                    parent: (pat.kind === 'method' || pat.kind === 'func') && lastClass && indent > lastClass.indent
                        ? lastClass.name : null
                });
                break;
            }
        }
        return symbols;
    }

    function renderOutline(symbols) {
        const list = document.getElementById('outline-list');
        if (!symbols.length) {
            list.innerHTML = '<div id="outline-empty">No symbols found</div>';
            return;
        }
        list.innerHTML = '';
        activeSymItem = null;

        // group: classes on top, then functions/routes
        const classes  = symbols.filter(s => s.kind === 'class');
        const methods  = symbols.filter(s => s.kind === 'method' || (s.kind === 'func' && s.parent));
        const funcs    = symbols.filter(s => (s.kind === 'func' || s.kind === 'arrow') && !s.parent);
        const routes   = symbols.filter(s => s.kind === 'route');
        const other    = symbols.filter(s => !['class','func','arrow','method','route'].includes(s.kind));

        function addGroup(label, items) {
            if (!items.length) return;
            const g = document.createElement('div');
            g.className = 'sym-group';
            g.textContent = label;
            list.appendChild(g);
            items.forEach(sym => {
                const el = document.createElement('div');
                el.className = 'sym-item';
                el.dataset.line = sym.line;
                el.innerHTML =
                    `<span class="sym-ico" style="color:${sym.color}">${sym.ico}</span>` +
                    `<span class="sym-name" title="${esc(sym.name)}">${esc(sym.name)}</span>` +
                    `<span class="sym-line">${sym.line}</span>`;
                el.addEventListener('click', () => jumpToLine(sym.line, el));
                list.appendChild(el);
            });
        }

        addGroup('Classes', classes);
        addGroup('Methods', methods);
        addGroup('Functions', funcs);
        addGroup('Routes', routes);
        addGroup('Other', other);
    }

    function jumpToLine(line, el) {
        if (!editor) return;
        if (activeSymItem) activeSymItem.classList.remove('active');
        activeSymItem = el;
        el.classList.add('active');
        editor.revealLineInCenter(line);
        editor.setPosition({ lineNumber: line, column: 1 });
        editor.focus();
    }

    function updateOutline() {
        if (!editor) return;
        const code = editor.getValue();
        const lang = editor.getModel()?.getLanguageId() || 'plaintext';
        const symbols = extractSymbols(code, lang);
        renderOutline(symbols);
    }

    function scheduleOutline() {
        clearTimeout(outlineDebounce);
        outlineDebounce = setTimeout(updateOutline, 500);
    }

    function toggleOutline() {
        outlineVisible = !outlineVisible;
        const panel = document.getElementById('outline-panel');
        const toggle = document.getElementById('outline-toggle');
        panel.classList.toggle('hidden', !outlineVisible);
        toggle.textContent = outlineVisible ? '×' : '☰';
        toggle.title = outlineVisible ? 'Hide outline' : 'Show outline';
    }

    // highlight current symbol on cursor move
    function syncOutlineCursor() {
        if (!editor) return;
        const line = editor.getPosition()?.lineNumber;
        if (!line) return;
        const items = document.querySelectorAll('.sym-item');
        let best = null, bestLine = 0;
        items.forEach(el => {
            const l = parseInt(el.dataset.line);
            if (l <= line && l > bestLine) { bestLine = l; best = el; }
        });
        if (best !== activeSymItem) {
            if (activeSymItem) activeSymItem.classList.remove('active');
            if (best) best.classList.add('active');
            activeSymItem = best;
            if (best) best.scrollIntoView({ block: 'nearest' });
        }
    }

    // ── Toast ───────────────────────────────────────────────────────────────────
    function toast(msg, isError) {
        const el = document.createElement('div');
        el.className = 'toast ' + (isError ? 'error' : 'ok');
        el.textContent = msg;
        document.body.appendChild(el);
        setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 2500);
    }

    // ── Console: tabs ────────────────────────────────────────────────────────────
    let activeTab = 'log';
    function switchTab(name) {
        activeTab = name;
        document.querySelectorAll('.ctab').forEach(t =>
            t.classList.toggle('active', t.dataset.tab === name));
        document.querySelectorAll('.cpane').forEach(p => p.classList.remove('active'));
        document.getElementById(name + '-pane').classList.add('active');
        if (name === 'log') refreshLog();
        if (name === 'term') {
            if (!term) setTimeout(initXterm, 50);
            else if (fitAddon) setTimeout(() => fitAddon.fit(), 10);
            setTimeout(() => document.getElementById('term-input').focus(), 120);
        }
    }
    function clearConsole() {
        if (activeTab === 'log') document.getElementById('log-pane').innerHTML = '';
        else if (term) term.clear();
    }

    // ── Service log ──────────────────────────────────────────────────────────────
    function colorizeLog(text) {
        const isRunning = /active \(running\)/.test(text);
        return text.split('\n').map(line => {
            // Bullet line
            if (/^●/.test(line)) {
                const cls = isRunning ? 'lg-run' : /failed|dead/.test(text) ? 'lg-stop' : 'lg-warn';
                return `<span class="${cls}">${esc(line)}</span>`;
            }
            // Key: value
            const kv = line.match(/^(\s*)([\w ]+):\s(.*)$/);
            if (kv) {
                let val = esc(kv[3]);
                if (kv[2].trim() === 'Active') {
                    const vc = /active \(running\)/.test(kv[3]) ? 'lg-arun'
                             : /inactive|failed|dead/.test(kv[3]) ? 'lg-fail' : 'lg-val';
                    val = `<span class="${vc}">${val}</span>`;
                } else {
                    val = `<span class="lg-val">${val}</span>`;
                }
                return `${esc(kv[1])}<span class="lg-key">${esc(kv[2])}:</span> ${val}`;
            }
            // Journal lines: "Jun 23 11:19:50 host proc: msg"
            const jr = line.match(/^([A-Z][a-z]{2}\s+\d+\s+[\d:]+)\s+(\S+)\s+(.*)/);
            if (jr) {
                return `<span class="lg-ts">${esc(jr[1])}</span> ` +
                       `<span class="lg-host">${esc(jr[2])}</span> ` +
                       `<span class="lg-val">${esc(jr[3])}</span>`;
            }
            // CGroup tree lines
            if (/└─|├─|CGroup/.test(line)) return `<span class="lg-dim">${esc(line)}</span>`;
            return esc(line);
        }).join('\n');
    }

    function refreshLog() {
        const name = document.getElementById('svc-select').value || '{{ service_name }}';
        fetch('/api/status?name=' + encodeURIComponent(name))
            .then(r => r.text())
            .then(text => {
                const pane = document.getElementById('log-pane');
                pane.innerHTML = colorizeLog(text);
                pane.scrollTop = pane.scrollHeight;
                // update status bar
                const dot = document.getElementById('svc-dot');
                dot.className = /active \(running\)/.test(text) ? 'running'
                              : /inactive|failed|dead/.test(text) ? 'stopped' : '';
                const aline = text.split('\n').find(l => /Active:/.test(l)) || '';
                document.getElementById('status-detail').textContent = aline.trim();
            })
            .catch(() => {
                document.getElementById('log-pane').textContent = 'Failed to fetch status.';
                document.getElementById('status-detail').textContent = 'Status unavailable';
            });
    }

    // ── Terminal ─────────────────────────────────────────────────────────────────
    let cmdHistory = [], histIdx = -1;
    let term = null, fitAddon = null;

    function initXterm() {
        if (term || typeof Terminal === 'undefined') return;
        fitAddon = new FitAddon.FitAddon();
        term = new Terminal({
            theme: {
                background: '#1a1a1a', foreground: '#d4d4d4',
                cursor: '#4ec9b0', cursorAccent: '#1a1a1a',
                selectionBackground: 'rgba(78,201,176,.25)',
                black:   '#1e1e1e', red:     '#f44747', green:   '#6dbf85', yellow:  '#d4a95a',
                blue:    '#569cd6', magenta: '#c586c0', cyan:    '#4ec9b0', white:   '#d4d4d4',
                brightBlack:   '#808080', brightRed:     '#f44747', brightGreen:   '#6dbf85',
                brightYellow:  '#d4a95a', brightBlue:    '#569cd6', brightMagenta: '#c586c0',
                brightCyan:    '#4ec9b0', brightWhite:   '#ffffff',
            },
            fontSize: 12,
            fontFamily: "'Cascadia Code','Fira Mono',Consolas,monospace",
            lineHeight: 1.4,
            convertEol: true,
            scrollback: 3000,
            disableStdin: true,
            cursorBlink: false,
            allowProposedApi: true,
        });
        term.loadAddon(fitAddon);
        term.open(document.getElementById('xterm-container'));
        fitAddon.fit();
        term.write('\x1b[38;5;78m' + document.getElementById('term-prompt').textContent + '\x1b[0m');
    }

    function termKeyDown(e) {
        const inp = document.getElementById('term-input');
        const promptTxt = document.getElementById('term-prompt').textContent;
        if (e.key === 'Enter') {
            const cmd = inp.value.trim();
            inp.value = ''; histIdx = -1;
            if (!term) initXterm();
            term.write('\x1b[38;5;78m' + promptTxt + '\x1b[0m' + cmd + '\r\n');
            if (!cmd) {
                term.write('\x1b[38;5;78m' + promptTxt + '\x1b[0m');
                return;
            }
            cmdHistory.unshift(cmd);
            if (cmdHistory.length > 200) cmdHistory.pop();
            execCmd(cmd);
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            if (histIdx < cmdHistory.length - 1) inp.value = cmdHistory[++histIdx];
        } else if (e.key === 'ArrowDown') {
            e.preventDefault();
            if (histIdx > 0) { inp.value = cmdHistory[--histIdx]; }
            else { histIdx = -1; inp.value = ''; }
        }
    }

    function execCmd(cmd) {
        const promptTxt = document.getElementById('term-prompt').textContent;
        fetch('/api/exec', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ cmd })
        })
        .then(r => r.json())
        .then(d => {
            if (!term) return;
            if (d.stdout) term.write(d.stdout);
            if (d.stderr) term.write('\x1b[38;5;203m' + d.stderr + '\x1b[0m');
            if (!d.stdout && !d.stderr && d.returncode !== 0)
                term.write('\x1b[38;5;203mExit code: ' + d.returncode + '\x1b[0m\r\n');
            term.write('\x1b[38;5;78m' + promptTxt + '\x1b[0m');
        })
        .catch(err => {
            if (term) {
                term.write('\x1b[38;5;203mRequest failed: ' + err.message + '\x1b[0m\r\n');
                term.write('\x1b[38;5;78m' + promptTxt + '\x1b[0m');
            }
        });
    }

    // ── Resize grip ──────────────────────────────────────────────────────────────
    (function () {
        const grip  = document.getElementById('resize-grip');
        const panel = document.getElementById('console-panel');
        let dragging = false, startY = 0, startH = 0;
        grip.addEventListener('mousedown', e => {
            dragging = true; startY = e.clientY; startH = panel.offsetHeight;
            grip.classList.add('dragging');
            document.body.style.cssText += ';cursor:ns-resize;user-select:none';
        });
        document.addEventListener('mousemove', e => {
            if (!dragging) return;
            const h = Math.max(60, Math.min(startH + startY - e.clientY, window.innerHeight * 0.75));
            panel.style.height = h + 'px';
        });
        document.addEventListener('mouseup', () => {
            if (!dragging) return;
            dragging = false;
            grip.classList.remove('dragging');
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
            if (fitAddon) setTimeout(() => fitAddon.fit(), 20);
        });
    })();
    window.addEventListener('resize', () => { if (fitAddon) fitAddon.fit(); });

    // ── Services modal ─────────────────────────────────────────────────
    let _allSvcs = [];

    function openSvcModal() {
        document.getElementById('svc-overlay').classList.add('open');
        document.getElementById('svc-mfilter').value = '';
        _loadSvcList();
        setTimeout(() => document.getElementById('svc-mfilter').focus(), 100);
    }

    function closeSvcModal() {
        document.getElementById('svc-overlay').classList.remove('open');
    }

    function _subBadge(sub) {
        const cls = sub==='running' ? 'sub-running'
                  : sub==='failed'  ? 'sub-failed'
                  : sub==='dead'    ? 'sub-dead' : 'sub-other';
        return `<span class="sub-badge ${cls}">${esc(sub)}</span>`;
    }

    function _renderSvcModal(list) {
        const cur = document.getElementById('svc-select').value;
        const tbody = document.getElementById('svc-mbody');
        if (!list.length) {
            tbody.innerHTML = '<tr><td colspan="4" style="color:#555;padding:16px 12px">No services found</td></tr>';
            return;
        }
        tbody.innerHTML = list.map(s => {
            const isCur = s.name === cur;
            return `<tr class="${isCur ? 'svc-cur' : ''}">
                <td><span class="svc-mname" onclick="selectSvc(${JSON.stringify(s.name)})">${esc(s.name)}</span></td>
                <td>${_subBadge(s.sub)}</td>
                <td><span class="svc-mdesc" title="${esc(s.desc)}">${esc(s.desc)}</span></td>
                <td><div class="svc-macts">
                    <button class="svc-mact sma-s" onclick="modalAct('start',${JSON.stringify(s.name)})">&#9654;</button>
                    <button class="svc-mact sma-x" onclick="modalAct('stop',${JSON.stringify(s.name)})">&#9632;</button>
                    <button class="svc-mact sma-r" onclick="modalAct('restart',${JSON.stringify(s.name)})">&#8634;</button>
                </div></td>
            </tr>`;
        }).join('');
    }

    function filterSvcModal() {
        const q = document.getElementById('svc-mfilter').value.toLowerCase();
        _renderSvcModal(_allSvcs.filter(s =>
            s.name.toLowerCase().includes(q) || s.desc.toLowerCase().includes(q)));
    }

    function _loadSvcList() {
        document.getElementById('svc-mbody').innerHTML =
            '<tr><td colspan="4" style="color:#555;padding:16px 12px">Loading…</td></tr>';
        fetch('/api/services').then(r => r.json()).then(data => {
            _allSvcs = data.services || [];
            const sel = document.getElementById('svc-select');
            const cur = sel.value;
            sel.innerHTML = _allSvcs.map(s =>
                `<option value="${esc(s.name)}"${s.name===cur?' selected':''}>${esc(s.name)}</option>`
            ).join('');
            if (!sel.value) sel.value = data.default || '{{ service_name }}';
            _renderSvcModal(_allSvcs);
        }).catch(() => {
            document.getElementById('svc-mbody').innerHTML =
                '<tr><td colspan="4" style="color:#f44;padding:16px 12px">Failed to load</td></tr>';
        });
    }

    function selectSvc(name) {
        const sel = document.getElementById('svc-select');
        if (![...sel.options].some(o => o.value === name)) {
            const opt = document.createElement('option');
            opt.value = opt.textContent = name;
            sel.appendChild(opt);
        }
        sel.value = name;
        onSvcChange();
        closeSvcModal();
    }

    function modalAct(action, name) {
        fetch('/api/service/' + action + '?name=' + encodeURIComponent(name))
            .then(r => r.json())
            .then(() => { toast(action + ' → ' + name); setTimeout(_loadSvcList, 1500); })
            .catch(() => toast('Command failed', true));
    }

    // Init: populate service dropdown
    _loadSvcList();
</script>

<!-- Image Preview -->
<div id="img-overlay" onclick="if(event.target===this)closeImage()">
    <img id="img-preview" src="" alt="">
    <div id="img-toolbar">
        <span id="img-name-lbl"></span>
        <button class="img-close-btn" onclick="closeImage()">Close &nbsp;Esc</button>
    </div>
</div>

<!-- Services Modal -->
<div id="svc-overlay" class="svc-overlay" onclick="if(event.target===this)closeSvcModal()">
    <div class="svc-modal-box">
        <div class="svc-mhead">
            <span class="svc-mtitle">All Services</span>
            <input id="svc-mfilter" class="svc-mfilter" type="text" placeholder="Filter…" oninput="filterSvcModal()">
            <button class="svc-mclose" onclick="closeSvcModal()">&#215;</button>
        </div>
        <div class="svc-mbody">
            <table class="svc-mtbl">
                <thead><tr>
                    <th>Service</th><th>State</th><th>Description</th><th></th>
                </tr></thead>
                <tbody id="svc-mbody"></tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
