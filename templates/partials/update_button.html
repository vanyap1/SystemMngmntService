{# Panel update notice (logged in only, js/updates.js): hidden until the panel's git upstream has new commits. #}
<div class="upd-wrap" id="upd-wrap" hidden>
    <button class="btn btn-update" id="upd-btn" onclick="Updates.toggle(event)" title="Panel update available">
        <i class="fa-solid fa-triangle-exclamation"></i><span class="upd-count" id="upd-count"></span>
    </button>
    <div class="upd-pop" id="upd-pop"></div>
</div>
