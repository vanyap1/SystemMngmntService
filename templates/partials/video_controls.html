<div class="video-ctrl-group" title="Video Devices">
    <i class="fa-solid fa-video"></i>
    <select id="video-dev-select" class="select-mono"></select>
    <button type="button" class="btn btn-ghost btn-square" onclick="Video.loadDevices()" title="Refresh video devices list"><i class="fa-solid fa-arrows-rotate"></i></button>
    <button type="button" class="btn btn-start btn-square" onclick="Video.open()" title="Play video stream"><i class="fa-solid fa-play"></i></button>
</div>
