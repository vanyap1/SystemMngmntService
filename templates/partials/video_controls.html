{# Video stream picker (logged in only, js/video.js): a top bar button with a small dropdown. #}
<div class="video-ctrl-group tb-drop">
    <button type="button" class="btn btn-nav" onclick="Video.toggleMenu(event)" title="Video stream from a camera"><i class="fa-solid fa-video"></i><span class="tb-label">Video</span></button>
    <div class="tb-drop-pop video-menu" id="video-menu">
        <label class="video-menu-label" for="video-dev-select">Video device</label>
        <div class="row">
            <select id="video-dev-select" class="select-mono"><option value="">—</option></select>
            <button type="button" class="btn btn-ghost btn-square" onclick="Video.loadDevices()" title="Refresh video devices list"><i class="fa-solid fa-arrows-rotate"></i></button>
        </div>
        <button type="button" class="btn btn-start btn-block" onclick="Video.closeMenu(); Video.open()"><i class="fa-solid fa-play"></i> Play stream</button>
    </div>
</div>
